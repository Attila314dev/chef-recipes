<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chef – Receptkatalógus</title>
  <meta name="description" content="Mobilbarát receptkatalógus szakácsoknak, kereshető és szűrhető kapcsolatalapú nézettel." />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/chef.css" />
</head>
<body data-page="chef-list">
  <header class="site-header">
    <div class="container header-row">
      <a href="index.html" class="brand">
        <span class="brand-mark">🍳</span>
        <span class="brand-text">Chef</span>
      </a>

      <nav class="site-nav" aria-label="Fő navigáció">
        <a href="index.html" class="nav-link is-active">Receptek</a>
        <a href="studio.html" class="nav-link">MasterChef Studio</a>
      </nav>
    </div>
  </header>

  <main class="container page page-chef">
    <section class="hero-card">
      <p class="eyebrow">Publikus nézet</p>
      <h1>Kapcsolatalapú receptkatalógus</h1>
      <p class="hero-copy">
        Keress receptek, technológiák, ízprofilok és attribútumok között.
      </p>
    </section>

    <section class="filters-panel" aria-labelledby="filters-title">
      <div class="filters-panel-head">
        <h2 id="filters-title">Keresés és szűrés</h2>
        <button id="clear-filters-btn" class="button button-secondary" type="button">
          Szűrők törlése
        </button>
      </div>

      <div class="form-row">
        <label class="field">
          <span class="field-label">Keresés</span>
          <input
            id="search-input"
            class="input"
            type="search"
            placeholder="Pl. leves, vegán, répa, főzés..."
            autocomplete="off"
          />
        </label>
      </div>

      <div class="filters-grid">
        <label class="field">
          <span class="field-label">Kategória</span>
          <select id="filter-category" class="select">
            <option value="">Összes</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">Diéta</span>
          <select id="filter-diet" class="select">
            <option value="">Összes</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">Technológia</span>
          <select id="filter-method" class="select">
            <option value="">Összes</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">Íz</span>
          <select id="filter-taste" class="select">
            <option value="">Összes</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">Textúra</span>
          <select id="filter-texture" class="select">
            <option value="">Összes</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">Színvilág</span>
          <select id="filter-color" class="select">
            <option value="">Összes</option>
          </select>
        </label>
      </div>

      <div class="active-filters-block">
        <div class="active-filters-head">
          <strong>Aktív szűrők</strong>
          <span id="results-count" class="results-count">0 találat</span>
        </div>
        <div id="active-filters" class="chip-row" aria-live="polite"></div>
      </div>
    </section>

    <section class="list-section" aria-labelledby="recipes-title">
      <div class="section-head">
        <h2 id="recipes-title">Receptek</h2>
      </div>

      <div id="recipes-empty" class="empty-state" hidden>
        <p>Nincs találat a megadott feltételekre.</p>
      </div>

      <div id="recipes-grid" class="recipes-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <p>Chef / MasterChef Studio – Vanilla JS V1 scaffold</p>
    </div>
  </footer>

  <script type="module" src="assets/js/chef-list.js"></script>
</body>
</html>
